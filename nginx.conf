# ═══════════════════════════════════════════════════════════════════
#  nginx.conf  —  Production reverse proxy for VoiceRAG
#  Handles: TLS termination (if certs provided), X-headers,
#           security headers, gzip, rate limiting, upstream routing
# ═══════════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ── Basic settings ───────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;             # hide Nginx version

    # ── Gzip ─────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        application/wasm font/woff2;

    # ── Log format with X-Request-ID ─────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'req_id="$http_x_request_id" '
                    'rt=$request_time us="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ── Rate limiting zones ───────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=30r/m;
    limit_req_zone $binary_remote_addr zone=audio_limit:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ── Upstream definitions ──────────────────────────────────────
    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:8000;
        keepalive 16;
    }

    # ── Server block ─────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Connection limit per IP
        limit_conn conn_limit 20;

        # ── Security Headers ─────────────────────────────────────
        add_header X-Frame-Options             "DENY"                          always;
        add_header X-Content-Type-Options      "nosniff"                       always;
        add_header X-XSS-Protection            "1; mode=block"                 always;
        add_header Referrer-Policy             "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy          "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy
            "default-src 'self'; \
             script-src 'self' 'unsafe-eval' 'unsafe-inline'; \
             style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
             font-src 'self' https://fonts.gstatic.com; \
             connect-src 'self'; \
             media-src 'self' blob:; \
             img-src 'self' data: blob:;"    always;
        add_header Strict-Transport-Security   "max-age=31536000; includeSubDomains" always;

        # ── X-Headers: pass + inject ─────────────────────────────
        # Propagate request ID from client or generate one
        set $req_id $http_x_request_id;
        if ($req_id = "") {
            set $req_id $request_id;       # nginx built-in unique ID
        }
        add_header X-Request-ID  $req_id  always;
        add_header X-Served-By   "voicerag-nginx" always;
        add_header X-Response-Time $request_time always;

        # Pass real client IP to upstream
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Request-ID       $req_id;
        proxy_set_header Host               $host;
        proxy_http_version 1.1;
        proxy_set_header Connection         "";   # enable keepalive to upstream

        # ── Backend API routes ────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=10 nodelay;

            # Strip /api prefix before forwarding to FastAPI
            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass         http://backend_upstream;
            proxy_read_timeout 30s;
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;

            # CORS headers (backend also sets these, belt+braces)
            add_header Access-Control-Allow-Origin  "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, X-Request-ID" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # ── Audio upload endpoint (larger body, stricter rate limit) ──
        location /api/query/audio {
            limit_req zone=audio_limit burst=3 nodelay;
            client_max_body_size 10M;               # max audio file size

            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         http://backend_upstream;
            proxy_read_timeout 60s;                  # STT can take ~2s
            proxy_connect_timeout 5s;
        }

        # ── Health check (no rate limit, no auth) ─────────────────
        location /api/health {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://backend_upstream;
            access_log off;
        }

        # ── Static assets: long-cache ─────────────────────────────
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location /favicon.ico {
            proxy_pass http://frontend_upstream;
            add_header Cache-Control "public, max-age=86400";
            access_log off;
        }

        # ── All other requests → Next.js frontend ─────────────────
        location / {
            proxy_pass         http://frontend_upstream;
            proxy_read_timeout 15s;
            proxy_connect_timeout 5s;

            # Next.js SSE / streaming support
            proxy_buffering    off;
            proxy_cache        off;
        }

        # ── Block common attack paths ─────────────────────────────
        location ~* \.(env|git|htaccess|DS_Store)$ {
            return 404;
        }
        location ~ /\. {
            return 404;
        }
    }
}
