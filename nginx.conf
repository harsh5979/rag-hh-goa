# ═══════════════════════════════════════════════════════════════════
#  nginx.conf — Production Reverse Proxy for VoiceStudio
#
#  Domains configured:
#    Frontend UI  → voicestudio.iomd.site
#    Backend API  → api.voicestudio.iomd.site
# ═══════════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # ── Basic Settings ───────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # ── Gzip Compression ─────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        application/wasm font/woff2;

    # ── Logging ──────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time us="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ── Upstream Definitions ─────────────────────────────────────
    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    # ═════════════════════════════════════════════════════════════
    # 1. BACKEND API SUBDOMAIN: api.voicestudio.iomd.site
    # ═════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name api.voicestudio.iomd.site;
        client_max_body_size 25M;

        # Let's Encrypt Certbot Challenge support
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Health Check
        location /health {
            proxy_pass http://backend_upstream/health;
            access_log off;
        }

        # API Docs (FastAPI Swagger & Redoc)
        location ~ ^/(docs|redoc|openapi.json) {
            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # All Backend API Endpoints & Streaming / WebSocket
        location / {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for voice synthesis & LLM streams
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_buffering off;
        }
    }

    # ═════════════════════════════════════════════════════════════
    # 2. FRONTEND WEB APP: voicestudio.iomd.site (and fallback _)
    # ═════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name voicestudio.iomd.site _;
        client_max_body_size 25M;

        # Let's Encrypt Certbot Challenge support
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Backend Proxy on same domain (/api/*)
        location /api/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
            proxy_connect_timeout 10s;
            proxy_buffering off;
        }

        # Next.js Static Assets Caching
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location /favicon.ico {
            proxy_pass http://frontend_upstream;
            add_header Cache-Control "public, max-age=86400";
            access_log off;
        }

        # Next.js Frontend Pages & SSE Streaming
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
        }

        # Block Hidden & Sensitive Files
        location ~* \.(env|git|htaccess|DS_Store)$ {
            return 404;
        }
        location ~ /\. {
            return 404;
        }
    }
}
