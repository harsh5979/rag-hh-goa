# ═══════════════════════════════════════════════════════════════════
#  CI/CD — Build → Test → Push → Deploy
#
#  Triggers:
#    push to main/master  → full build + deploy to production
#    pull_request         → build + test only (no deploy)
#
#  Required GitHub Secrets (Settings → Secrets → Actions):
#    SARVAM_API_KEY       — Sarvam STT key
#    GROQ_API_KEY         — Groq LLM key
#    DOCKERHUB_USERNAME   — Docker Hub username  (OR use GHCR below)
#    DOCKERHUB_TOKEN      — Docker Hub access token
#    DEPLOY_HOST          — SSH host IP/domain for production server
#    DEPLOY_USER          — SSH username (e.g. ubuntu)
#    DEPLOY_SSH_KEY       — Private SSH key (PEM format)
#    DEPLOY_PATH          — Remote path e.g. /home/ubuntu/rag-hh-goa
# ═══════════════════════════════════════════════════════════════════

name: CI/CD — VoiceRAG

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE:  ${{ secrets.DOCKERHUB_USERNAME }}/voicerag-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/voicerag-frontend

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Lint & Type Check
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend linting deps
        run: |
          pip install ruff mypy pydantic pydantic-settings
        working-directory: backend

      - name: Ruff lint (backend)
        run: ruff check app/
        working-directory: backend
        continue-on-error: true   # non-blocking for hackathon speed

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --frozen-lockfile
        working-directory: frontend

      - name: TypeScript check (frontend)
        run: npx tsc --noEmit
        working-directory: frontend
        continue-on-error: true


  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Build Docker Images
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      backend_tag:  ${{ steps.meta-backend.outputs.tags }}
      frontend_tag: ${{ steps.meta-frontend.outputs.tags }}
      short_sha:    ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── Backend image ──────────────────────────────────────────
      - name: Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=ref,event=branch

      - name: Build & Push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to:   type=gha,scope=backend,mode=max
          build-args: |
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
            GIT_SHA=${{ steps.vars.outputs.sha_short }}

      # ── Frontend image ─────────────────────────────────────────
      - name: Docker metadata (frontend)
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            type=ref,event=branch

      - name: Build & Push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to:   type=gha,scope=frontend,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            BUILD_DATE=${{ steps.vars.outputs.build_date }}
            GIT_SHA=${{ steps.vars.outputs.sha_short }}


  # ─────────────────────────────────────────────────────────────────
  # JOB 3: Deploy to Production (push to main only)
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:        ${{ secrets.DEPLOY_HOST }}
          username:    ${{ secrets.DEPLOY_USER }}
          key:         ${{ secrets.DEPLOY_SSH_KEY }}
          port:        22
          script_stop: true
          script: |
            set -euo pipefail

            # ── Pull latest code ───────────────────────────────
            cd ${{ secrets.DEPLOY_PATH }}
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            echo "✓ Code pulled: $(git rev-parse --short HEAD)"

            # ── Write secrets to backend/.env ─────────────────
            # (Secrets are NOT in git — written fresh on each deploy)
            cat > backend/.env << 'ENVEOF'
            SARVAM_API_KEY=${{ secrets.SARVAM_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            GENERATION_MODE=auto
            GROQ_FALLBACK_MODELS=llama-3.1-8b-instant,gemma2-9b-it,llama-3.3-70b-versatile
            GROQ_TIMEOUTS_MS=250,350,500
            GROQ_MAX_TOKENS=300
            GROQ_RETRIES_PER_MODEL=1
            GROQ_TEMPERATURE=0.1
            FAISS_INDEX_PATH=indexes/faiss_hnsw.index
            BM25_INDEX_PATH=indexes/bm25_index.pkl
            METADATA_PATH=indexes/chunk_metadata.jsonl
            TOP_K_DENSE=20
            TOP_K_SPARSE=20
            TOP_K_RERANK=5
            OFF_TOPIC_THRESHOLD=0.35
            GROUNDING_THRESHOLD=0.60
            RETRIEVAL_CONFIDENCE_MIN=0.40
            REDIS_URL=redis://redis:6379
            CACHE_TTL_SECONDS=3600
            LOG_LEVEL=INFO
            REQUESTS_LOG=logs/requests.jsonl
            GUARDRAIL_LOG=logs/guardrail_events.jsonl
            ENVEOF
            echo "✓ Secrets written"

            # ── Pull new images ────────────────────────────────
            export BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            export GIT_SHA=${{ needs.build.outputs.short_sha }}
            docker compose pull --quiet
            echo "✓ Images pulled"

            # Restart services one by one (redis → backend → frontend → nginx)
            docker compose -f docker-compose.yml up -d --no-build --remove-orphans redis
            docker compose -f docker-compose.yml up -d --no-build --remove-orphans backend
            docker compose -f docker-compose.yml up -d --no-build --remove-orphans frontend
            docker compose -f docker-compose.yml up -d --no-build --remove-orphans nginx
            echo "✓ Services restarted"

            # ── Health check ───────────────────────────────────
            sleep 15
            docker compose ps
            curl -f http://localhost:8000/health && echo "✓ Backend healthy"
            curl -f http://localhost:3000        && echo "✓ Frontend healthy"
            curl -f http://localhost/api/health  && echo "✓ Nginx proxy healthy"

            # ── Prune old images ───────────────────────────────
            docker image prune -f --filter "until=24h"
            echo "✓ Deploy complete: ${{ needs.build.outputs.short_sha }}"
