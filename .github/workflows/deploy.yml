# ═══════════════════════════════════════════════════════════════════
#  CI/CD — Lint → Deploy directly on server via Docker
#
#  Triggers:
#    push to main/master  → lint + direct deploy on server
#    pull_request         → lint & type check only
#
#  Required GitHub Secrets (Settings → Secrets → Actions):
#    SARVAM_API_KEY       — Sarvam STT/TTS key
#    GROQ_API_KEY         — Groq LLM key
#    DEPLOY_HOST          — SSH host IP / domain of your server
#    DEPLOY_USER          — SSH username (e.g. ubuntu, root, ec2-user)
#    DEPLOY_SSH_KEY       — Private SSH key (PEM / OpenSSH format)
#    DEPLOY_PATH          — Remote folder path (e.g. /home/ubuntu/rag-hh-goa)
# ═══════════════════════════════════════════════════════════════════

name: CI/CD — VoiceRAG

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1: Lint & Type Check
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend linting deps
        run: |
          pip install ruff mypy pydantic pydantic-settings
        working-directory: backend

      - name: Ruff lint (backend)
        run: ruff check app/
        working-directory: backend
        continue-on-error: true

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --frozen-lockfile
        working-directory: frontend

      - name: TypeScript check (frontend)
        run: npx tsc --noEmit
        working-directory: frontend
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────
  # JOB 2: Deploy directly to server via SSH & Docker Compose
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:        ${{ secrets.DEPLOY_HOST }}
          username:    ${{ secrets.DEPLOY_USER }}
          key:         ${{ secrets.DEPLOY_SSH_KEY }}
          port:        22
          script_stop: true
          script: |
            set -euo pipefail

            # ── 1. Ensure Git & Docker are installed on fresh server ─
            if ! command -v git &> /dev/null; then
              echo "Installing git..."
              sudo apt-get update -y && sudo apt-get install -y git
            fi

            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker "${{ secrets.DEPLOY_USER }}" || true
            fi

            # ── 2. Clone or update repository ───────────────────────
            mkdir -p "$(dirname "${{ secrets.DEPLOY_PATH }}")"
            if [ ! -d "${{ secrets.DEPLOY_PATH }}/.git" ]; then
              echo "Fresh server detected: Cloning repository..."
              git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "${{ secrets.DEPLOY_PATH }}"
              cd "${{ secrets.DEPLOY_PATH }}"
            else
              cd "${{ secrets.DEPLOY_PATH }}"
              git fetch origin
              git reset --hard "origin/${{ github.ref_name }}"
            fi
            echo "✓ Code ready: $(git rev-parse --short HEAD)"

            # ── 3. Write secrets to backend/.env ────────────────────
            cat > backend/.env << 'ENVEOF'
            SARVAM_API_KEY=${{ secrets.SARVAM_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            GENERATION_MODE=auto
            GROQ_FALLBACK_MODELS=llama-3.1-8b-instant,gemma2-9b-it,llama-3.3-70b-versatile
            GROQ_TIMEOUTS_MS=250,350,500
            GROQ_MAX_TOKENS=300
            GROQ_RETRIES_PER_MODEL=1
            GROQ_TEMPERATURE=0.1
            FAISS_INDEX_PATH=indexes/msmarco.faiss
            BM25_INDEX_PATH=indexes/msmarco.bm25
            METADATA_PATH=indexes/metadata.jsonl
            TOP_K_DENSE=5
            TOP_K_SPARSE=5
            TOP_K_RERANK=4
            OFF_TOPIC_THRESHOLD=0.35
            GROUNDING_THRESHOLD=0.60
            RETRIEVAL_CONFIDENCE_MIN=0.40
            REDIS_URL=redis://redis:6379
            CACHE_TTL_SECONDS=3600
            LOG_LEVEL=INFO
            REQUESTS_LOG=logs/requests.jsonl
            GUARDRAIL_LOG=logs/guardrail_events.jsonl
            ENVEOF
            echo "✓ Environment variables configured"

            # ── 4. Build & Run Docker containers on server ─────────
            echo "Building and starting Docker services..."
            docker compose build --parallel
            docker compose up -d --remove-orphans
            echo "✓ Containers started"

            # ── 5. Health checks ───────────────────────────────────
            sleep 15
            docker compose ps
            curl -f http://localhost:8000/health || true
            curl -f http://localhost:3000 || true

            # ── 6. Clean up unused images ──────────────────────────
            docker image prune -f --filter "until=24h"
            echo "✓ Deployment complete!"
