name: voicerag

services:

  # ── REDIS ─────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: voicerag-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    networks:
      - voicerag-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── BACKEND ───────────────────────────────────────────────────────
  backend:
    build:
      context: .                          # ← repo root (contains backend/ dir)
      dockerfile: Dockerfile.backend      # ← at root, COPY backend/... works
      args:
        BUILD_DATE: ${BUILD_DATE:-unknown}
        GIT_SHA: ${GIT_SHA:-unknown}
    image: voicerag-backend:latest
    container_name: voicerag-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/indexes:/app/indexes:ro
      - ./backend/logs:/app/logs
      - ./backend/benchmarks:/app/benchmarks
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - REDIS_URL=redis://redis:6379
    networks:
      - voicerag-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 2G

  # ── FRONTEND ──────────────────────────────────────────────────────
  frontend:
    build:
      context: .                          # ← repo root (contains frontend/ dir)
      dockerfile: Dockerfile.frontend     # ← at root, COPY frontend/... works
      args:
        NEXT_PUBLIC_API_URL: /api
        BUILD_DATE: ${BUILD_DATE:-unknown}
    image: voicerag-frontend:latest
    container_name: voicerag-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - BACKEND_URL=http://backend:8000
    networks:
      - voicerag-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ── NGINX ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: voicerag-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - voicerag-net
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ── INDEX BUILDER (one-shot setup) ────────────────────────────────
  build-index:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: voicerag-indexer
    command: python scripts/build_index.py --languages en hi
    profiles:
      - setup
    volumes:
      - ./backend/data:/app/data
      - ./backend/indexes:/app/indexes
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - voicerag-net

networks:
  voicerag-net:
    driver: bridge
    name: voicerag-net
