[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-hh-goa-backend"
version = "0.1.0"
description = "Voice-Enabled RAG System — HH Goa 2026"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",    # file uploads

    # Pydantic
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # ML / Retrieval
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",
    "torch>=2.3",
    "transformers>=4.41",
    "optimum[onnxruntime]>=1.20",  # ONNX export for BGE-small

    # Data
    "datasets>=2.20",
    "huggingface-hub>=0.23",
    "numpy>=1.26",
    "scipy>=1.13",

    # Groq LLM
    "groq>=0.9",

    # Sarvam STT & Fallback TTS
    "httpx>=0.27",
    "edge-tts>=6.1.12",


    # Retry / reliability
    "tenacity>=8.3",

    # Guardrails
    "better-profanity>=0.7",
    "scikit-learn>=1.5",           # TF-IDF for extractive gen

    # Cache
    "redis>=5.0",
    "hiredis>=2.3",

    # Utils
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "nltk>=3.8",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",                 # test client
    "anyio>=4.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
